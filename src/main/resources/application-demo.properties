# Demo profil: H2 in-memory database, ingen ekstern DB nødvendig.
# Kør med:  mvn spring-boot:run -Dspring-boot.run.profiles=demo

spring.datasource.url=jdbc:h2:mem:demodb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sql/demo_schema.sql
spring.sql.init.data-locations=classpath:sql/demo_data.sql
spring.sql.init.continue-on-error=false

spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.thymeleaf.cache=false

# Lyt paa den port Render giver os (PORT env var), fald tilbage til 8080 lokalt
server.port=${PORT:8080}