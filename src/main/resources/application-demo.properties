# Demo profil: H2 in-memory database, ingen ekstern DB nødvendig.
# Kør med:  mvn spring-boot:run -Dspring-boot.run.profiles=demo

spring.datasource.url=jdbc:h2:mem:demodb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sql/demo_schema.sql
spring.sql.init.data-locations=classpath:sql/demo_data.sql
spring.sql.init.continue-on-error=false

# H2 console er slaaet fra i demo (ingen database-admin paa en public URL)
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=none
spring.thymeleaf.cache=false

# Session-cookie saettes med HttpOnly + SameSite=Lax som default beskyttelse mod XSS/CSRF
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Login-session udloeber efter 2 timers inaktivitet
server.servlet.session.timeout=2h
# Brug kun cookies til session (ingen session-id i URL = ingen laekage via referer-headere)
server.servlet.session.tracking-modes=COOKIE

# Server identificerer sig ikke med version
server.error.include-stacktrace=never
server.error.include-message=never

# Lyt paa den port Render giver os (PORT env var), fald tilbage til 8080 lokalt
server.port=${PORT:8080}