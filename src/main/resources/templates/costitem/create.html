<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Ny omkostning'">Project Manager</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
<header th:replace="~{layout :: header('projects')}"></header>
<main>
<div class="crumbs">
    <a th:href="@{'/project/view/' + ${project.id}}" th:text="${project.name}">Projekt</a>
    <span class="sep">/</span>
    <a th:href="@{'/projects/' + ${project.id} + '/costitems'}">Omkostninger</a>
    <span class="sep">/</span>
    <span class="current">Ny</span>
</div>

<header class="page-head">
    <div class="title-block">
        <span class="eyebrow purple">Ny post</span>
        <h1 style="margin-top:14px">Opret omkostning</h1>
        <p class="lede" style="margin-top:8px">Én linje pr. post. Antal × enhedspris beregnes automatisk.</p>
    </div>
</header>

<div class="card" style="max-width:640px">
    <form class="form" method="post" th:action="@{'/projects/' + ${project.id} + '/costitems/create'}">
        <div class="field">
            <label>Navn</label>
            <input name="name" required autofocus placeholder="fx Figma License">
        </div>
        <div class="form-row">
            <div class="field">
                <label>Antal</label>
                <input name="quantity" type="number" step="0.01" value="1" required>
            </div>
            <div class="field">
                <label>Enhedspris (kr)</label>
                <input name="unitPrice" type="number" step="0.01" required placeholder="0,00">
            </div>
        </div>
        <div class="form-actions">
            <button class="btn primary" type="submit">Opret <span class="arrow">→</span></button>
            <a class="btn ghost" th:href="@{'/projects/' + ${project.id} + '/costitems'}">Annuller</a>
        </div>
    </form>
</div>

</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
