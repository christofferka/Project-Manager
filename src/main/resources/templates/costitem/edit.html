<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Rediger omkostning'">Project Manager</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
<header th:replace="~{layout :: header('projects')}"></header>
<main>
<div class="crumbs">
    <a th:href="@{'/projects/' + ${projectId} + '/costitems'}">Omkostninger</a>
    <span class="sep">/</span>
    <span class="current">Rediger</span>
</div>

<header class="page-head">
    <div class="title-block">
        <span class="eyebrow purple">Rediger post</span>
        <h1 style="margin-top:14px">Rediger omkostning</h1>
        <p class="lede" style="margin-top:8px">Opdater felter og gem.</p>
    </div>
</header>

<div class="card" style="max-width:640px">
    <form class="form" method="post" th:action="@{'/projects/' + ${projectId} + '/costitems/edit'}">
        <input type="hidden" name="id" th:value="${item.id}">
        <div class="field">
            <label>Navn</label>
            <input name="name" th:value="${item.name}" required>
        </div>
        <div class="form-row">
            <div class="field">
                <label>Antal</label>
                <input name="quantity" type="number" step="0.01" th:value="${item.quantity}" required>
            </div>
            <div class="field">
                <label>Enhedspris (kr)</label>
                <input name="unitPrice" type="number" step="0.01" th:value="${item.unitPrice}" required>
            </div>
        </div>
        <div class="form-actions">
            <button class="btn primary" type="submit">Gem <span class="arrow">→</span></button>
            <a class="btn ghost" th:href="@{'/projects/' + ${projectId} + '/costitems'}">Annuller</a>
        </div>
    </form>
</div>

</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
