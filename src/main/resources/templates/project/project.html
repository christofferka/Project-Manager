<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Dine Projekter</title>
    <link rel="stylesheet" th:href="@{/css/dashboard/dashboard-common.css}">
    <link rel="stylesheet" th:href="@{/css/project/project.css}">
</head>

<body>

<div class="topbar">
    <a href="/" class="logo">Project Manager</a>
    <a href="/dashboard" class="back-btn">Tilbage</a>
</div>

<div class="page-container">

    <h1>Dine Projekter</h1>
    <p class="subtitle">Vælg et projekt for at se roadmap, subprojekter og tasks</p>

    <div class="project-grid">

        <div class="project-card" th:each="p : ${project}">
            <h3 th:text="${p.name}"></h3>
            <p th:text="${p.customerName}"></p>

            <a class="btn" th:href="@{'/project/' + ${p.id}}">Åbn projekt</a>
        </div>

    </div>

    <a href="/project/create" class="btn-primary">Tilføj projekt</a>

</div>

</body>
</html>
