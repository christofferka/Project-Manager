<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Rediger subtask'">Project Manager</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
<header th:replace="~{layout :: header('projects')}"></header>
<main>
<div class="crumbs">
    <a th:href="@{'/subtasks/' + ${task.id}}">Subtasks</a>
    <span class="sep">/</span>
    <span class="current" th:text="${subtask.name}">Subtask</span>
</div>

<header class="page-head">
    <div class="title-block">
        <span class="eyebrow">Rediger</span>
        <h1 style="margin-top:14px" th:text="${subtask.name}">Rediger subtask</h1>
    </div>
</header>

<div class="card" style="max-width:720px">
    <form class="form wide" th:action="@{/subtasks/edit}" method="post">
        <input type="hidden" name="id" th:value="${subtask.id}">
        <input type="hidden" name="taskId" th:value="${task.id}">

        <div class="field">
            <label>Navn</label>
            <input type="text" name="name" th:value="${subtask.name}" required>
        </div>

        <div class="field">
            <label>Beskrivelse</label>
            <textarea name="description" th:text="${subtask.description}"></textarea>
        </div>

        <div class="form-row">
            <div class="field">
                <label>Deadline</label>
                <input type="date" name="deadline" th:value="${subtask.deadline}">
            </div>
            <div class="field">
                <label>Status</label>
                <select name="status">
                    <option th:each="s : ${taskStatusList}"
                            th:value="${s}"
                            th:text="${s.displayName}"
                            th:selected="${s == subtask.status}"></option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="field">
                <label>Estimerede timer</label>
                <input type="number" step="0.01" name="estimatedHours" th:value="${subtask.estimatedHours}">
            </div>
            <div class="field">
                <label>Faktiske timer</label>
                <input type="number" step="0.01" name="actualHours" th:value="${subtask.actualHours}">
            </div>
        </div>

        <div class="field">
            <label>Ansvarlig</label>
            <select name="userId">
                <option value="">Ingen tildelt</option>
                <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.username}"
                        th:selected="${subtask.userId == u.id}"></option>
            </select>
        </div>

        <div class="form-actions">
            <button class="btn primary" type="submit">Gem ændringer <span class="arrow">→</span></button>
            <a class="btn ghost" th:href="@{'/subtasks/' + ${task.id}}">Annuller</a>
        </div>
    </form>
</div>

</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
