<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Subtasks · ' + ${task.name}">Project Manager</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
<header th:replace="~{layout :: header('projects')}"></header>
<main>
<div class="crumbs">
    <a th:href="@{/dashboard}">Dashboard</a>
    <span class="sep">/</span>
    <a th:href="@{'/project/view/' + ${project.id}}" th:text="${project.name}">Projekt</a>
    <span class="sep">/</span>
    <a th:href="@{'/project/' + ${project.id} + '/tasks?subprojectId=' + ${subproject.id}}" th:text="${subproject.name}">Delprojekt</a>
    <span class="sep">/</span>
    <span class="current" th:text="${task.name}">Opgave</span>
</div>

<header class="page-head">
    <div class="title-block">
        <span class="eyebrow" th:text="${task.name}">Opgave</span>
        <h1 style="margin-top:14px">Subtasks</h1>
        <p class="lede" style="margin-top:8px">Opdel opgaven i håndterbare delaktiviteter.</p>
    </div>
    <div class="actions">
        <a class="btn primary"
           th:href="@{'/subtasks/create/' + ${task.id}}">+ Ny subtask</a>
    </div>
</header>

<div class="table-wrap">
    <table class="data-table">
        <thead>
        <tr>
            <th style="width:50px">#</th>
            <th>Navn</th>
            <th style="width:120px">Status</th>
            <th style="width:110px">Deadline</th>
            <th style="width:130px">Ansvarlig</th>
            <th class="num" style="width:100px">Est.</th>
            <th class="num" style="width:100px">Faktisk</th>
            <th style="width:180px"></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s, iter : ${subtasks}">
            <td class="num" style="color:var(--ink-3)" th:text="${iter.count}">1</td>
            <td>
                <div class="row-title" th:text="${s.name}">Subtask</div>
                <span class="sub" th:if="${s.description}" th:text="${s.description}">Beskrivelse</span>
            </td>
            <td>
                <span th:switch="${s.status.name()}">
                    <span th:case="'NOT_STARTED'" class="pill status-ns">Ikke startet</span>
                    <span th:case="'IN_PROGRESS'" class="pill status-ip">I gang</span>
                    <span th:case="'DONE'"        class="pill status-dn">Færdig</span>
                </span>
            </td>
            <td class="num" th:text="${s.deadline != null ? #temporals.format(s.deadline, 'dd.MM.yy') : '—'}">01.02.26</td>
            <td style="color:var(--ink)" th:text="${s.employeeName ?: '—'}">Anna</td>
            <td class="num" th:text="${#numbers.formatDecimal(s.estimatedHours ?: 0, 1, 1) + ' t'}">5,0 t</td>
            <td class="num" th:text="${s.actualHours != null ? #numbers.formatDecimal(s.actualHours, 1, 1) + ' t' : '—'}">3,0 t</td>
            <td class="actions">
                <a class="btn ghost sm" th:href="@{'/subtasks/edit/' + ${s.id}}">Rediger</a>
                <form th:action="@{'/subtasks/delete/' + ${s.id}}" method="post" style="display:inline"
                      onsubmit="return confirm('Slet subtask?');">
                    <button type="submit" class="btn danger sm">Slet</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(subtasks)}">
            <td colspan="8">
                <div class="empty">
                    <span class="em">▸</span>
                    <strong>Ingen subtasks endnu</strong>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
