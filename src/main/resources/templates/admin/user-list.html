<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Brugere · Administration'">Project Manager</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
<header th:replace="~{layout :: header('admin')}"></header>
<main>
<div class="crumbs">
    <a th:href="@{/dashboard}">Dashboard</a>
    <span class="sep">/</span>
    <span class="current">Administration · Brugere</span>
</div>

<header class="page-head">
    <div class="title-block">
        <span class="eyebrow">Administration</span>
        <h1 style="margin-top:14px">Brugere</h1>
        <p class="lede" style="margin-top:8px">Oversigt over alle konti og roller.</p>
    </div>
    <div class="actions">
        <a th:href="@{/admin/users/create}" class="btn primary">+ Ny bruger</a>
    </div>
</header>

<div class="table-wrap">
    <table class="data-table">
        <thead>
        <tr>
            <th style="width:70px">#</th>
            <th>Bruger</th>
            <th>Email</th>
            <th style="width:160px">Rolle</th>
            <th style="width:140px"></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${users}">
            <td class="num" style="color:var(--ink-3)" th:text="|#${#numbers.formatInteger(u.id, 4)}|">#0001</td>
            <td>
                <div style="display:flex; align-items:center; gap:10px">
                    <span style="width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg, var(--brand), var(--purple)); color:#fff; display:grid; place-items:center; font-size:12px; font-weight:700; text-transform:uppercase" th:text="${#strings.substring(u.username,0,1)}">D</span>
                    <div class="row-title" th:text="${u.username}">demo</div>
                </div>
            </td>
            <td style="color:var(--ink-2)" th:text="${u.email}">demo@example.com</td>
            <td>
                <span th:switch="${u.role}">
                    <span th:case="'ADMIN'"  class="pill role-adm">Administrator</span>
                    <span th:case="'EDITOR'" class="pill role-edt">Editor</span>
                    <span th:case="*" class="pill role-vw" th:text="${u.role}">User</span>
                </span>
            </td>
            <td class="actions">
                <a class="btn ghost sm" th:href="@{'/admin/users/' + ${u.id} + '/edit'}">Rediger</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(users)}">
            <td colspan="5"><div class="empty"><span class="em">👥</span><strong>Ingen brugere</strong></div></td>
        </tr>
        </tbody>
    </table>
</div>

</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
