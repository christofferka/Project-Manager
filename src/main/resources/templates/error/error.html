<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Fejl · Project Manager'">Project Manager</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
<header th:replace="~{layout :: header('')}"></header>
<main>
<div class="err">
    <div>
        <div class="code" th:text="${status} ?: '!'">!</div>
        <h1 th:text="${error} ?: 'Noget gik galt'">Noget gik galt</h1>
        <p th:text="${message} ?: 'En uventet fejl opstod.'">En uventet fejl opstod.</p>
        <a th:href="@{/dashboard}" class="btn primary">Tilbage <span class="arrow">→</span></a>
    </div>
</div>
</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
